# Two <mask> sections for the same key with salts only, and with a key that is not valid UTF-8, which ends the loop of value_pattern in v1.0.0.
<source>
  @type compat_records
  tag test
</source>

<filter test>
  @type anonymizer
  salts ["s1", "s2", "s3", "s4"]
  <mask sha1>
    keys user_id, session_id
  </mask>
  <mask sha1>
    value_pattern @mydomain
  </mask>
  <mask md5>
    keys session_id, user_id, zz
    salt s
  </mask>
</filter>

<match test>
  @type compat_dump
</match>
