# value_in_subnet with an IPv4-mapped network. v1.0.0 on Ruby 2.7 masks the
# IPv4 addresses in it too.
<source>
  @type compat_records
  tag test
</source>

<filter test>
  @type anonymizer
  salt s
  <mask sha256>
    value_in_subnet ::ffff:0:0/96
  </mask>
</filter>

<match test>
  @type compat_dump
</match>
