# The parameters of v1.0.0 with <mask>, which v1.0.0 applies after all <mask> sections.
<source>
  @type compat_records
  tag test
</source>

<filter test>
  @type anonymizer
  salt       masksalt
  sha1_keys  user_id, mail
  hash_salt  mysaltstring
  ipaddr_mask_keys host
  <mask md5>
    keys user_id, member_id
  </mask>
  <mask network>
    keys host6
    ipv6_mask_bits 32
  </mask>
</filter>

<match test>
  @type compat_dump
</match>
