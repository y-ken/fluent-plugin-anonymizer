# A <mask> with a hash method and no salt anywhere, with another <mask> that works. v1.0.0 outputs its values as they are, and logs an error for each.
<source>
  @type compat_records
  tag test
</source>

<filter test>
  @type anonymizer
  hash_salt mysaltstring
  sha1_keys member_id
  <mask sha1>
    keys user_id, $.nest.id
    key_pattern ^mai
    value_pattern ^Tana
  </mask>
  <mask network>
    keys host
    ipv4_mask_bits 24
  </mask>
</filter>

<match test>
  @type compat_dump
</match>
