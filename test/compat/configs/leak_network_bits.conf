# network with bits out of range, with one family only, and without bits.
<source>
  @type compat_records
  tag test
</source>

<filter test>
  @type anonymizer
  <mask network>
    keys host, user_id
    ipv4_mask_bits 33
    ipv6_mask_bits 64
  </mask>
  <mask network>
    keys host6, mail
    ipv4_mask_bits 24
    ipv6_mask_bits 129
  </mask>
  <mask network>
    keys mapped, ips, $.nest.ip
    ipv4_mask_bits 24
  </mask>
  <mask network>
    keys not_ip, member_id
  </mask>
  <mask sha1>
    keys tel
    salt s
    ipv4_mask_bits 33
  </mask>
</filter>

<match test>
  @type compat_dump
</match>
