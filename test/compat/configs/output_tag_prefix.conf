# out_anonymizer of v1.0.0 with remove_tag_prefix and add_tag_prefix, and all the hash methods and ipaddr_mask_keys.
<source>
  @type compat_records
  tag input.access
</source>

<match input.access>
  @type anonymizer
  md5_keys          user_id, null
  sha1_keys         member_id, nest.id
  sha256_keys       mail, list
  sha384_keys       tel
  sha512_keys       card
  hash_salt         mysaltstring
  ipaddr_mask_keys  host, host6, ips, nest.ip
  remove_tag_prefix input.
  add_tag_prefix    anonymized.
</match>

<match anonymized.**>
  @type compat_dump
</match>
