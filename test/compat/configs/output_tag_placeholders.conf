# out_anonymizer of v1.0.0 with placeholders in tag, which it expands after remove_tag_prefix.
<source>
  @type compat_records
  tag input.access
</source>

<match input.access>
  @type anonymizer
  sha256_keys       user_id
  hash_salt         mysaltstring
  remove_tag_prefix input.
  tag               anonymized.__TAG__.${tag_parts[0]}.${tag}.__TAG_PARTS[0..-1]__
</match>

<match anonymized.**>
  @type compat_dump
</match>
