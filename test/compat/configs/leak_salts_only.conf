# salts without salt. v1.0.0 has no salt for a key that selects the first of the list, and the empty key.
<source>
  @type compat_records
  tag test
</source>

<filter test>
  @type anonymizer
  salts ["s1", "s2", "s3", "s4"]
  <mask sha1>
    keys user_id, session_id, member_id, a, b, c, d, id, ab
  </mask>
  <mask md5>
    key_pattern ^(tel|card|)$
  </mask>
</filter>

<match test>
  @type compat_dump
</match>
