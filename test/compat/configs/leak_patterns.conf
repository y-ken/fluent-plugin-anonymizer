# key_pattern, value_pattern and value_in_subnet, with values in ASCII-8BIT and not valid UTF-8.
<source>
  @type compat_records
  tag test
</source>

<filter test>
  @type anonymizer
  salt s
  <mask sha1>
    value_pattern @mydomain
  </mask>
  <mask sha256>
    value_pattern 田中
  </mask>
  <mask sha384>
    value_pattern ^.{12}$
  </mask>
  <mask md5>
    key_pattern ^(mail|名前)
  </mask>
  <mask sha512>
    value_in_subnet 192.168.0.0/16
  </mask>
</filter>

<match test>
  @type compat_dump
</match>
