# out_anonymizer of v1.0.0 with remove_tag_suffix, add_tag_suffix, include_tag_key and tag_key, and without hash_salt.
<source>
  @type compat_records
  tag input.access
</source>

<match input.access>
  @type anonymizer
  sha1_keys         user_id, member_id
  ipaddr_mask_keys  host, host6
  ipv4_mask_subnet  16
  ipv6_mask_subnet  48
  remove_tag_suffix .access
  add_tag_suffix    .anonymized
  include_tag_key   true
  tag_key           original_tag
</match>

<match *.anonymized>
  @type compat_dump
</match>
