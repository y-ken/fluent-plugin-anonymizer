# salts with null and a number. A <mask> with its own salt does not use them.
<source>
  @type compat_records
  tag test
</source>

<filter test>
  @type anonymizer
  salts ["s1", null, 3]
  <mask sha1>
    keys user_id, session_id, mail, a, b, c
  </mask>
  <mask sha256>
    keys tel
    salt own
  </mask>
</filter>

<match test>
  @type compat_dump
</match>
