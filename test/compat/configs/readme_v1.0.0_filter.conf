# The filter example of the README of v1.0.0.
<source>
  @type compat_records
  tag test
</source>

<filter test>
  @type anonymizer
  sha1_keys         user_id, member_id, mail
  hash_salt         mysaltstring
  ipaddr_mask_keys  host
  ipv4_mask_subnet  24
  ipv6_mask_subnet  104
</filter>

<match test>
  @type compat_dump
</match>
