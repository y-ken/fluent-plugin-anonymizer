# out_anonymizer with ipv4_mask_subnet out of range. v1.0.0 outputs IPv4 addresses as they are.
<source>
  @type compat_records
  tag input.access
</source>

<match input.access>
  @type anonymizer
  sha1_keys         user_id
  ipaddr_mask_keys  host, host6, ips, nest.ip
  ipv4_mask_subnet  33
  remove_tag_prefix input.
  add_tag_prefix    anonymized.
</match>

<match anonymized.**>
  @type compat_dump
</match>
