  @type compat_records
  tag test
</source>

<filter test>
  @type anonymizer
  ipaddr_mask_keys host, host6, mapped, ips
  ipv4_mask_subnet 33
  ipv6_mask_subnet 64
  sha1_keys user_id
</filter>

<match test>
  @type compat_dump
</match>
