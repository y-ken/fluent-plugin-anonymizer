# <mask> with key_chain and two or more key_chains, which v1.0.0 accepted.
<source>
  @type compat_records
  tag test
</source>

<filter test>
  @type anonymizer
  <mask sha256>
    key_chain  nest.name
    key_chains ["nest.id", "nest.deep.id", "nest.null", "nest.missing"]
    salt mysaltstring
  </mask>
  <mask sha1>
    key        user_id
    keys       member_id
    key_chains nest.ip, nest.deep.id
    salt mysaltstring
  </mask>
</filter>

<match test>
  @type compat_dump
</match>
