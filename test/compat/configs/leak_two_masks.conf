# Two <mask> sections for the same key, where the first one leaves the value as it is in v1.0.0 and the second one masks it.
<source>
  @type compat_records
  tag test
</source>

<filter test>
  @type anonymizer
  <mask sha1>
    keys user_id
  </mask>
  <mask network>
    keys host, mapped, ips
    ipv4_mask_bits 33
    ipv6_mask_bits 64
  </mask>
  <mask network>
    keys host6
    ipv4_mask_bits 24
  </mask>
  <mask md5>
    keys user_id, host, mapped, ips, host6
    salt s
  </mask>
</filter>

<match test>
  @type compat_dump
</match>
