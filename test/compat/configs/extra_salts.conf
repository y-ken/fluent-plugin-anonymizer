# salt and salts together (index 0 is salt), nested keys without their own salt, an empty key,
# and key_pattern with mask_array_elements.
<source>
  @type compat_records
  tag test
</source>
<filter test>
  @type anonymizer
  salt s0
  salts ["s1", "s2", "s3"]
  <mask sha1>
    key_chain nest.id
    key_chains ["nest.deep.id", "nest.name"]
    keys user_id, session_id, a, b, c, d
  </mask>
  <mask md5>
    key_pattern ^(list|ips|)$
    mask_array_elements true
  </mask>
</filter>
<match test>
  @type compat_dump
</match>
